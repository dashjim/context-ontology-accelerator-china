[project]
name = "coa-common"
version = "0.3.5"
description = "Shared utilities for Context Ontology Accelerator"
requires-python = ">=3.12"

dependencies = [
    # >=1.39: botocore sends AWS_BEARER_TOKEN_BEDROCK (Bedrock API keys, see
    # coa_common.bedrock_access) as a bearer token from this release on.
    "boto3>=1.39.0",
    # Cedar policy engine for coa_authorization (shared by the control-plane API
    # authorizer and the serve-path query authorizer). arm64 cp312 wheel exists.
    "cedarpy>=4.8.0",
    "cryptography>=50.0.0",
    # OpenAI-compatible LLM transport (coa_common.openai_compat), used only when
    # LLM_PROVIDER=openai_compatible (regions without Bedrock). Imported lazily.
    "httpx>=0.27",
    # Shared AOSS vector client (coa_common.opensearch). opensearch-py
    # provides the client + SigV4 signer; requests-aws4auth is a transitive of the
    # RequestsHttpConnection path. Consolidates the per-package clients that
    # ontology-engine / metric-service / serve previously hand-rolled.
    "opensearch-py>=2.5",
    "requests-aws4auth>=1.3",
    "pydantic-settings>=2.0",
    "PyJWT>=2.13.0",
    "requests>=2.34.2",
    "structlog>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_common", "src/coa_authorization"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]
